name: ML tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  all-ml-fixtures:
    name: All ML fixtures
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LLVM and build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install llvm@22 cmake zstd

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm@22)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DMLIR_DIR="$LLVM_PREFIX/lib/cmake/mlir" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix zstd)"

      - name: Build unified test runner and interface tests
        run: cmake --build build --target tester tensor_interfaces metal_runtime_checks metal_stub_checks cpu_input_contracts gpu_input_contracts gpu_input_stub_contracts grouped_spec_checks shaped_cpu_contracts shaped_gpu_contracts shaped_gpu_stub_contracts f32_cpu_contracts f32_gpu_contracts f32_gpu_stub_contracts --parallel 3

      - name: Run compiler data suite and runner contracts
        run: ctest --test-dir build --output-on-failure
