name: ML tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  all-ml-fixtures:
    name: All ML fixtures
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install LLVM and build tools
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install llvm cmake zstd

      - name: Configure
        run: |
          LLVM_PREFIX="$(brew --prefix llvm)"
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="$LLVM_PREFIX/bin/clang" \
            -DCMAKE_CXX_COMPILER="$LLVM_PREFIX/bin/clang++" \
            -DLLVM_DIR="$LLVM_PREFIX/lib/cmake/llvm" \
            -DMLIR_DIR="$LLVM_PREFIX/lib/cmake/mlir" \
            -DCMAKE_PREFIX_PATH="$(brew --prefix zstd)"

      - name: Build ML test runner
        run: cmake --build build --target tester --parallel 3

      - name: Run all ML fixtures
        run: ./build/tester
